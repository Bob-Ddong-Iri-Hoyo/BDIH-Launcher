<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self' file:; script-src 'self' file: 'unsafe-inline'; style-src 'self' file: 'unsafe-inline'; img-src 'self' file: data: https:" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>BDIH Launcher</title>
    <style>
        html,
        body,
        #root {
            width: 100%;
            height: 100%;
            margin: 0;
            background: #050812;
        }

        body {
            overflow: hidden;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .bootstrap-splash {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #050812;
        }

        .bootstrap-splash__image,
        .bootstrap-splash__shade {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        .bootstrap-splash__image {
            object-fit: cover;
        }

        .bootstrap-splash__shade {
            background: linear-gradient(180deg, rgba(5, 8, 18, 0.08), rgba(5, 8, 18, 0.88));
        }

        .bootstrap-splash__content {
            position: absolute;
            right: 32px;
            bottom: 28px;
            left: 32px;
        }

        .bootstrap-splash__brand {
            margin-bottom: 12px;
            color: rgba(248, 250, 252, 0.92);
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .bootstrap-splash__track {
            height: 4px;
            overflow: hidden;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.14);
        }

        .bootstrap-splash__bar {
            width: 38%;
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(90deg, #67e8f9, #38bdf8);
            animation: bootstrap-progress 1.1s ease-in-out infinite;
        }

        @keyframes bootstrap-progress {
            0% { transform: translateX(-115%); }
            100% { transform: translateX(365%); }
        }
    </style>
</head>
<body>
    <div id="root">
        <% if (bootstrapSplashImage) { %>
        <div class="bootstrap-splash" aria-hidden="true">
            <img class="bootstrap-splash__image" src="<%= bootstrapSplashImage %>" alt="" />
            <div class="bootstrap-splash__shade"></div>
            <div class="bootstrap-splash__content">
                <div class="bootstrap-splash__brand">BDIH Launcher</div>
                <div class="bootstrap-splash__track">
                    <div class="bootstrap-splash__bar"></div>
                </div>
            </div>
        </div>
        <% } %>
    </div>
</body>
</html>
