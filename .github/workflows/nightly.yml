name: Nightly

on:
  schedule:
    # 00:00 KST
    - cron: "0 15 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Build even when the selected source commit was already published"
        required: false
        default: false
        type: boolean
      build_latest_head:
        description: "For manual runs, build the latest source branch HEAD instead of the 00:00 KST snapshot"
        required: false
        default: false
        type: boolean
      target_repository:
        description: "Override nightly release repository, e.g. owner/BDIH-Launcher-nightly"
        required: false
        type: string

concurrency:
  group: nightly-main
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  KEEP_NIGHTLY_RELEASES: "10"
  SOURCE_BRANCH: main
  TARGET_NIGHTLY_BRANCH: nightly

jobs:
  nightly:
    name: Nightly macOS release
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Resolve target release repository
        id: target
        env:
          NIGHTLY_RELEASE_TOKEN: ${{ secrets.NIGHTLY_RELEASE_TOKEN }}
          TARGET_REPOSITORY_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.target_repository || '' }}
          TARGET_REPOSITORY_VAR: ${{ vars.NIGHTLY_RELEASE_REPOSITORY }}
        run: |
          set -euo pipefail

          target_repository="${TARGET_REPOSITORY_INPUT:-$TARGET_REPOSITORY_VAR}"
          target_repository="${target_repository//[[:space:]]/}"

          if [[ -z "$target_repository" ]]; then
            echo "::error::Set the NIGHTLY_RELEASE_REPOSITORY repository variable to the nightly repo, for example owner/BDIH-Launcher-nightly."
            exit 1
          fi

          if [[ ! "$target_repository" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "::error::NIGHTLY_RELEASE_REPOSITORY must look like owner/repo. Got: $target_repository"
            exit 1
          fi

          if [[ -z "$NIGHTLY_RELEASE_TOKEN" ]]; then
            echo "::error::Set the NIGHTLY_RELEASE_TOKEN secret with contents:write access to $target_repository."
            exit 1
          fi

          echo "release_repository=$target_repository" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Resolve nightly source and version
        id: source
        env:
          BUILD_LATEST_HEAD: ${{ github.event_name == 'workflow_dispatch' && inputs.build_latest_head || false }}
        run: |
          set -euo pipefail

          git fetch origin "refs/heads/${SOURCE_BRANCH}:refs/remotes/origin/${SOURCE_BRANCH}" --tags --force

          cutoff_kst="$(TZ=Asia/Seoul date +%Y-%m-%dT00:00:00%z)"
          cutoff_display="$cutoff_kst"
          nightly_date="$(TZ=Asia/Seoul date +%Y%m%d)"

          if [[ "$BUILD_LATEST_HEAD" == "true" ]]; then
            source_sha="$(git rev-parse "origin/${SOURCE_BRANCH}")"
            cutoff_display="manual latest ${SOURCE_BRANCH} HEAD"
          else
            source_sha="$(git rev-list -1 --before="$cutoff_kst" "origin/${SOURCE_BRANCH}")"
          fi

          if [[ -z "$source_sha" ]]; then
            echo "::error::No commit was found on ${SOURCE_BRANCH} before $cutoff_display."
            exit 1
          fi

          export NIGHTLY_DATE="$nightly_date"
          export NIGHTLY_CUTOFF_KST="$cutoff_display"
          export SOURCE_SHA="$source_sha"

          node <<'NODE'
          const childProcess = require("child_process");
          const fs = require("fs");

          const outputPath = process.env.GITHUB_OUTPUT;
          const releaseTagPattern = /^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/;
          const stableVersionPattern = /^\d+\.\d+\.\d+$/;

          function writeOutput(key, value) {
            fs.appendFileSync(outputPath, `${key}=${value}\n`);
          }

          function git(args) {
            return childProcess.execFileSync("git", args, { encoding: "utf8" })
              .split(/\r?\n/)
              .map((line) => line.trim())
              .filter(Boolean);
          }

          function gitRaw(args) {
            return childProcess.execFileSync("git", args, { encoding: "utf8" });
          }

          const sourceSha = process.env.SOURCE_SHA;
          const tagsAtSource = git(["tag", "--points-at", sourceSha]);
          const releaseTagsAtSource = tagsAtSource.filter((tag) => releaseTagPattern.test(tag));

          if (releaseTagsAtSource.length > 0) {
            writeOutput("should_build", "false");
            writeOutput("skip_reason", `source commit already has release tag ${releaseTagsAtSource.join(",")}`);
            writeOutput("source_sha", sourceSha);
            writeOutput("source_short_sha", sourceSha.slice(0, 7));
            process.exit(0);
          }

          const sourcePackage = JSON.parse(gitRaw(["show", `${sourceSha}:package.json`]));
          const sourcePackageVersion = String(sourcePackage.version ?? "");
          const baseVersion = sourcePackageVersion.replace(/-.*/, "");

          if (!stableVersionPattern.test(baseVersion)) {
            throw new Error(`package.json version must resolve to x.y.z for nightly builds. Got: ${sourcePackageVersion}`);
          }

          const sourceShortSha = sourceSha.slice(0, 7);
          const nightlyVersion = `${baseVersion}-nightly.${process.env.NIGHTLY_DATE}.${process.env.GITHUB_RUN_NUMBER}.g${sourceShortSha}`;

          writeOutput("should_build", "true");
          writeOutput("source_sha", sourceSha);
          writeOutput("source_short_sha", sourceShortSha);
          writeOutput("cutoff_kst", process.env.NIGHTLY_CUTOFF_KST);
          writeOutput("nightly_date", process.env.NIGHTLY_DATE);
          writeOutput("base_version", baseVersion);
          writeOutput("nightly_version", nightlyVersion);
          writeOutput("nightly_tag", `v${nightlyVersion}`);
          writeOutput("source_package_version", sourcePackageVersion);
          NODE

      - name: Decide whether to publish
        id: decide
        if: steps.source.outputs.should_build == 'true'
        env:
          FORCE_BUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
          GH_TOKEN: ${{ secrets.NIGHTLY_RELEASE_TOKEN }}
          RELEASE_REPOSITORY: ${{ steps.target.outputs.release_repository }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          set -euo pipefail

          if [[ "$FORCE_BUILD" == "true" ]]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "skip_reason=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          node <<'NODE'
          const fs = require("fs");

          const outputPath = process.env.GITHUB_OUTPUT;
          const releaseRepository = process.env.RELEASE_REPOSITORY;
          const sourceSha = process.env.SOURCE_SHA;
          const token = process.env.GH_TOKEN;

          function writeOutput(key, value) {
            fs.appendFileSync(outputPath, `${key}=${value}\n`);
          }

          async function github(path, options = {}) {
            const response = await fetch(`https://api.github.com/repos/${releaseRepository}${path}`, {
              ...options,
              headers: {
                accept: "application/vnd.github+json",
                authorization: `Bearer ${token}`,
                "x-github-api-version": "2022-11-28",
                ...(options.headers ?? {}),
              },
            });

            if (!response.ok) {
              throw new Error(`GitHub API ${options.method ?? "GET"} ${path} failed: ${response.status} ${await response.text()}`);
            }

            return response.json();
          }

          async function main() {
            const releases = [];

            for (let page = 1; ; page += 1) {
              const chunk = await github(`/releases?per_page=100&page=${page}`);
              releases.push(...chunk);

              if (chunk.length < 100) {
                break;
              }
            }

            const duplicate = releases.find((release) =>
              release.prerelease &&
              /^v\d+\.\d+\.\d+-nightly\./.test(release.tag_name) &&
              (release.body ?? "").includes(`Source commit: ${sourceSha}`),
            );

            if (duplicate) {
              writeOutput("should_build", "false");
              writeOutput("skip_reason", `source commit already published as ${duplicate.tag_name}`);
              return;
            }

            writeOutput("should_build", "true");
            writeOutput("skip_reason", "");
          }

          main().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Report skipped nightly
        if: steps.source.outputs.should_build != 'true' || steps.decide.outputs.should_build == 'false'
        env:
          SOURCE_SKIP_REASON: ${{ steps.source.outputs.skip_reason }}
          DECIDE_SKIP_REASON: ${{ steps.decide.outputs.skip_reason }}
        run: |
          set -euo pipefail
          echo "Skipping nightly: ${SOURCE_SKIP_REASON:-$DECIDE_SKIP_REASON}"

      - name: Checkout nightly source
        if: steps.decide.outputs.should_build == 'true'
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          set -euo pipefail
          git checkout --detach "$SOURCE_SHA"

      - name: Ensure publish repository override
        if: steps.decide.outputs.should_build == 'true'
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require("fs");
          const configPath = "electron-builder.config.cjs";
          const publishRepositoryLine = "const repository = process.env.PUBLISH_REPOSITORY || process.env.GITHUB_REPOSITORY || \"\";";

          if (!fs.existsSync(configPath)) {
            process.exit(0);
          }

          const source = fs.readFileSync(configPath, "utf8");

          if (source.includes("process.env.PUBLISH_REPOSITORY")) {
            process.exit(0);
          }

          const next = source
            .replace("const repository = process.env.GITHUB_REPOSITORY ?? \"\";", publishRepositoryLine)
            .replace("const repository = process.env.GITHUB_REPOSITORY || \"\";", publishRepositoryLine);

          if (next === source) {
            console.warn("electron-builder.config.cjs does not expose a repository env override; continuing without patch.");
            process.exit(0);
          }

          fs.writeFileSync(configPath, next);
          NODE

      - name: Install dependencies
        if: steps.decide.outputs.should_build == 'true'
        run: pnpm install --frozen-lockfile

      - name: Set nightly version
        if: steps.decide.outputs.should_build == 'true'
        env:
          NIGHTLY_VERSION: ${{ steps.source.outputs.nightly_version }}
        run: |
          set -euo pipefail

          echo "NIGHTLY_VERSION=$NIGHTLY_VERSION" >> "$GITHUB_ENV"
          node <<'NODE'
          const fs = require("fs");
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));

          pkg.version = process.env.NIGHTLY_VERSION;
          fs.writeFileSync("package.json", `${JSON.stringify(pkg, null, 2)}\n`);
          NODE

      - name: Build nightly
        if: steps.decide.outputs.should_build == 'true'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          PUBLISH_REPOSITORY: ${{ steps.target.outputs.release_repository }}
          RELEASE_TYPE: prerelease
          UPDATE_CHANNEL: nightly
          BDIH_DISCORD_CLIENT_ID: ${{ vars.BDIH_DISCORD_CLIENT_ID || secrets.BDIH_DISCORD_CLIENT_ID }}
          BDIH_DISCORD_SHOW_IDLE: ${{ vars.BDIH_DISCORD_SHOW_IDLE || 'true' }}
          BDIH_DISCORD_LARGE_IMAGE_KEY: ${{ vars.BDIH_DISCORD_LARGE_IMAGE_KEY || 'bdih_logo' }}
        run: |
          set -euo pipefail
          if [[ -z "${BDIH_DISCORD_CLIENT_ID:-}" ]]; then
            echo "::warning::BDIH_DISCORD_CLIENT_ID is not set; Discord Rich Presence will be disabled in this build."
          fi
          pnpm build
          pnpm exec electron-builder --mac --publish never --config electron-builder.config.cjs

      - name: Update nightly release branch
        if: steps.decide.outputs.should_build == 'true'
        env:
          GH_TOKEN: ${{ secrets.NIGHTLY_RELEASE_TOKEN }}
          NIGHTLY_TAG: ${{ steps.source.outputs.nightly_tag }}
          NIGHTLY_VERSION: ${{ steps.source.outputs.nightly_version }}
          RELEASE_REPOSITORY: ${{ steps.target.outputs.release_repository }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          SNAPSHOT_CUTOFF_KST: ${{ steps.source.outputs.cutoff_kst }}
        run: |
          set -euo pipefail

          anchor_dir="$(mktemp -d)"

          cleanup() {
            rm -rf "$anchor_dir"
          }

          trap cleanup EXIT
          cd "$anchor_dir"

          git init
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${RELEASE_REPOSITORY}.git"

          if git fetch --depth=1 origin "$TARGET_NIGHTLY_BRANCH"; then
            git checkout -b "$TARGET_NIGHTLY_BRANCH" FETCH_HEAD
          else
            git checkout -b "$TARGET_NIGHTLY_BRANCH"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf .github/workflows

          node <<'NODE'
          const fs = require("fs");

          const metadata = {
            version: process.env.NIGHTLY_VERSION,
            tag: process.env.NIGHTLY_TAG,
            sourceRepository: process.env.GITHUB_REPOSITORY,
            sourceBranch: process.env.SOURCE_BRANCH,
            sourceCommit: process.env.SOURCE_SHA,
            snapshotCutoffKst: process.env.SNAPSHOT_CUTOFF_KST,
          };

          fs.writeFileSync("nightly-source.json", `${JSON.stringify(metadata, null, 2)}\n`);

          if (!fs.existsSync("README.md")) {
            fs.writeFileSync(
              "README.md",
              [
                "# BDIH Launcher Nightly Releases",
                "",
                "This branch is only an anchor for GitHub Releases.",
                "The source commit for each build is recorded in the release notes and nightly-source.json asset.",
                "",
              ].join("\n"),
            );
          }
          NODE

          git add README.md nightly-source.json
          if git diff --cached --quiet; then
            echo "Nightly release branch is already up to date."
          else
            git commit -m "Update nightly release anchor for $NIGHTLY_TAG"
            git push origin "HEAD:refs/heads/${TARGET_NIGHTLY_BRANCH}"
          fi

      - name: Create nightly release
        if: steps.decide.outputs.should_build == 'true'
        env:
          GH_TOKEN: ${{ secrets.NIGHTLY_RELEASE_TOKEN }}
          NIGHTLY_DATE: ${{ steps.source.outputs.nightly_date }}
          NIGHTLY_TAG: ${{ steps.source.outputs.nightly_tag }}
          NIGHTLY_VERSION: ${{ steps.source.outputs.nightly_version }}
          RELEASE_REPOSITORY: ${{ steps.target.outputs.release_repository }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          SOURCE_SHORT_SHA: ${{ steps.source.outputs.source_short_sha }}
          SNAPSHOT_CUTOFF_KST: ${{ steps.source.outputs.cutoff_kst }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          node <<'NODE'
          const fs = require("fs");

          const metadata = {
            version: process.env.NIGHTLY_VERSION,
            tag: process.env.NIGHTLY_TAG,
            sourceRepository: process.env.GITHUB_REPOSITORY,
            sourceBranch: process.env.SOURCE_BRANCH,
            sourceCommit: process.env.SOURCE_SHA,
            snapshotCutoffKst: process.env.SNAPSHOT_CUTOFF_KST,
          };

          fs.writeFileSync("release/nightly-source.json", `${JSON.stringify(metadata, null, 2)}\n`);
          fs.writeFileSync(
            "release-notes.md",
            [
              "Nightly build for BDIH Launcher.",
              "",
              `Source repository: ${metadata.sourceRepository}`,
              `Source branch: ${metadata.sourceBranch}`,
              `Source commit: ${metadata.sourceCommit}`,
              `Snapshot cutoff: ${metadata.snapshotCutoffKst}`,
              "",
            ].join("\n"),
          );
          NODE

          assets=(release/*.dmg release/*.zip release/*.yml release/*.blockmap release/nightly-source.json)

          if (( ${#assets[@]} == 0 )); then
            echo "::error::No release assets were generated."
            exit 1
          fi

          gh release create "$NIGHTLY_TAG" "${assets[@]}" \
            --repo "$RELEASE_REPOSITORY" \
            --target "$TARGET_NIGHTLY_BRANCH" \
            --title "BDIH Launcher Nightly $NIGHTLY_DATE ($SOURCE_SHORT_SHA)" \
            --notes-file release-notes.md \
            --prerelease

      - name: Prune old nightly releases
        if: steps.decide.outputs.should_build == 'true'
        env:
          GH_TOKEN: ${{ secrets.NIGHTLY_RELEASE_TOKEN }}
          KEEP_NIGHTLY_RELEASES: ${{ env.KEEP_NIGHTLY_RELEASES }}
          RELEASE_REPOSITORY: ${{ steps.target.outputs.release_repository }}
        run: |
          set -euo pipefail

          node <<'NODE'
          const releaseRepository = process.env.RELEASE_REPOSITORY;
          const keep = Number(process.env.KEEP_NIGHTLY_RELEASES);
          const token = process.env.GH_TOKEN;

          async function github(path, options = {}) {
            const response = await fetch(`https://api.github.com/repos/${releaseRepository}${path}`, {
              ...options,
              headers: {
                accept: "application/vnd.github+json",
                authorization: `Bearer ${token}`,
                "x-github-api-version": "2022-11-28",
                ...(options.headers ?? {}),
              },
            });

            if (response.status === 404 && options.ignore404) {
              return undefined;
            }

            if (!response.ok) {
              throw new Error(`GitHub API ${options.method ?? "GET"} ${path} failed: ${response.status} ${await response.text()}`);
            }

            if (response.status === 204) {
              return undefined;
            }

            return response.json();
          }

          async function main() {
            const releases = [];

            for (let page = 1; ; page += 1) {
              const chunk = await github(`/releases?per_page=100&page=${page}`);
              releases.push(...chunk);

              if (chunk.length < 100) {
                break;
              }
            }

            const nightlyReleases = releases
              .filter((release) => release.prerelease && /^v\d+\.\d+\.\d+-nightly\./.test(release.tag_name))
              .sort((left, right) => Date.parse(right.created_at) - Date.parse(left.created_at));
            const staleReleases = nightlyReleases.slice(keep);

            for (const release of staleReleases) {
              await github(`/releases/${release.id}`, { method: "DELETE" });
              await github(`/git/refs/tags/${encodeURIComponent(release.tag_name)}`, {
                method: "DELETE",
                ignore404: true,
              });
              console.log(`Deleted old nightly release ${release.tag_name}.`);
            }
          }

          main().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
