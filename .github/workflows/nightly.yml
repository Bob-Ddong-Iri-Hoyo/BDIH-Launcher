name: Nightly

on:
  schedule:
    # 23:00 KST
    - cron: "0 14 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Build even when the latest successful nightly used the same commit"
        required: false
        default: false
        type: boolean

concurrency:
  group: nightly-main
  cancel-in-progress: false

jobs:
  nightly:
    name: Nightly macOS artifact
    runs-on: macos-latest
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Decide whether to build
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_BUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
        run: |
          if [[ "$FORCE_BUILD" == "true" ]]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          node <<'NODE'
          const fs = require("fs");

          async function main() {
            const response = await fetch(
              `${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}/actions/workflows/nightly.yml/runs?branch=main&status=success&per_page=10`,
              {
                headers: {
                  authorization: `Bearer ${process.env.GH_TOKEN}`,
                  accept: "application/vnd.github+json",
                },
              },
            );
            const data = await response.json();
            const currentRunId = Number(process.env.GITHUB_RUN_ID);
            const previousRun = (data.workflow_runs || []).find((run) => Number(run.id) !== currentRunId);
            const shouldBuild = !previousRun || previousRun.head_sha !== process.env.GITHUB_SHA;

            fs.appendFileSync(process.env.GITHUB_OUTPUT, `should_build=${shouldBuild}\n`);
            console.log(
              shouldBuild
                ? `Nightly build required for ${process.env.GITHUB_SHA}.`
                : `Skipping nightly: ${process.env.GITHUB_SHA} was already built by run ${previousRun.id}.`,
            );
          }

          main().catch((error) => {
            console.error(error);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "should_build=true\n");
          });
          NODE

      - name: Install dependencies
        if: steps.decide.outputs.should_build == 'true'
        run: pnpm install --frozen-lockfile

      - name: Set nightly version
        if: steps.decide.outputs.should_build == 'true'
        env:
          GITHUB_SHA_VALUE: ${{ github.sha }}
        run: |
          BASE_VERSION="$(node -p "require('./package.json').version.replace(/-.*/, '')")"
          SHORT_SHA="${GITHUB_SHA_VALUE:0:7}"
          NIGHTLY_DATE="$(date -u +%Y%m%d)"
          NIGHTLY_VERSION="${BASE_VERSION}-nightly.${NIGHTLY_DATE}.${SHORT_SHA}"

          echo "NIGHTLY_VERSION=$NIGHTLY_VERSION" >> "$GITHUB_ENV"
          node <<'NODE'
          const fs = require("fs");
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          pkg.version = process.env.NIGHTLY_VERSION;
          fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
          NODE

      - name: Build nightly
        if: steps.decide.outputs.should_build == 'true'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: pnpm build && pnpm exec electron-builder --mac --config electron-builder.config.cjs

      - name: Upload nightly artifact
        if: steps.decide.outputs.should_build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: BDIH-Launcher-nightly-${{ env.NIGHTLY_VERSION }}-macos
          path: |
            release/*.dmg
            release/*.zip
            release/*.yml
            release/*.blockmap
          if-no-files-found: error
          retention-days: 14
