name: TestProduction Candidate

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Source branch, tag, or commit SHA to stage"
        required: true
        default: "main"
        type: string
      channel:
        description: "Production channel"
        required: true
        default: "beta"
        type: choice
        options:
          - beta
          - stable
      beta_number:
        description: "Beta only: Production Beta number, e.g. 1 becomes 1.0.0-beta.1"
        required: false
        type: number
      stable_parent_beta_tag:
        description: "Stable only: exact tested Beta staging tag used as this RC's parent"
        required: false
        default: ""
        type: string

concurrency:
  group: staging-testproduction
  cancel-in-progress: false

env:
  TARGET_REPOSITORY: Bob-Ddong-Iri-Hoyo/BDIH-Launcher-TestProduction
  TARGET_STAGING_BRANCH: staging

jobs:
  staging:
    name: Stage ${{ inputs.channel }} candidate
    runs-on: macos-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.candidate.outputs.version }}
      target_version: ${{ steps.candidate.outputs.target_version }}
      attempt: ${{ steps.candidate.outputs.attempt }}
      channel: ${{ steps.candidate.outputs.channel }}
      promotable: ${{ steps.candidate.outputs.promotable }}
      tag: ${{ steps.candidate.outputs.tag }}
      source_sha: ${{ steps.candidate.outputs.source_sha }}
      source_run_url: ${{ steps.candidate.outputs.source_run_url }}

    steps:
      - name: Checkout candidate source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Resolve candidate
        id: candidate
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.STAGING_RELEASE_TOKEN }}
          REQUESTED_CHANNEL: ${{ inputs.channel }}
          BETA_NUMBER: ${{ inputs.beta_number }}
        run: |
          set -euo pipefail

          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::error::Add STAGING_RELEASE_TOKEN to the source repository Actions secrets."
            exit 1
          fi

          package_version="$(node -p "require('./package.json').version")"
          target_version="$(node scripts/staging-promotion-policy.mjs resolve-target \
            --source-version "$package_version" \
            --channel "$REQUESTED_CHANNEL" \
            --beta-number "${BETA_NUMBER:-0}")"

          gh release list \
            --repo "$TARGET_REPOSITORY" \
            --limit 1000 \
            --json tagName,isDraft,isPrerelease \
            > "$RUNNER_TEMP/staging-releases.json"
          gh api \
            --paginate \
            "repos/$TARGET_REPOSITORY/git/matching-refs/tags/v${package_version}" \
            --jq '.[].ref' \
            > "$RUNNER_TEMP/staging-tag-refs.txt"

          node <<'NODE'
          const fs = require("fs");
          const releases = JSON.parse(fs.readFileSync(
            process.env.RUNNER_TEMP + "/staging-releases.json",
            "utf8",
          ));
          const refs = fs.readFileSync(
            process.env.RUNNER_TEMP + "/staging-tag-refs.txt",
            "utf8",
          ).split(/\r?\n/).filter(Boolean);
          const identities = new Map(releases.map((release) => [release.tagName, release]));
          for (const ref of refs) {
            const tagName = ref.replace(/^refs\/tags\//, "");
            if (!identities.has(tagName)) {
              identities.set(tagName, { tagName });
            }
          }
          fs.writeFileSync(
            process.env.RUNNER_TEMP + "/staging-candidate-identities.json",
            `${JSON.stringify([...identities.values()], null, 2)}\n`,
          );
          NODE

          node scripts/staging-promotion-policy.mjs resolve-next \
            --target-version "$target_version" \
            --releases "$RUNNER_TEMP/staging-candidate-identities.json" \
            --github-output "$GITHUB_OUTPUT"

          source_sha="$(git rev-parse HEAD)"
          source_short_sha="$(git rev-parse --short=8 HEAD)"
          source_run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          node scripts/staging-promotion-policy.mjs validate-source-train \
            --source-version "$package_version" \
            --target-version "$target_version" >/dev/null
          {
            echo "source_sha=$source_sha"
            echo "source_short_sha=$source_short_sha"
            echo "source_run_url=$source_run_url"
            echo "created_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "promotable=true"
          } >> "$GITHUB_OUTPUT"

      - name: Validate candidate
        id: lineage
        shell: bash
        env:
          STAGING_VERSION: ${{ steps.candidate.outputs.version }}
          TARGET_VERSION: ${{ steps.candidate.outputs.target_version }}
          STAGING_ATTEMPT: ${{ steps.candidate.outputs.attempt }}
          STAGING_TAG: ${{ steps.candidate.outputs.tag }}
          STAGING_CHANNEL: ${{ steps.candidate.outputs.channel }}
          SOURCE_SHA: ${{ steps.candidate.outputs.source_sha }}
          STABLE_PARENT_BETA_TAG: ${{ inputs.stable_parent_beta_tag }}
          GH_TOKEN: ${{ secrets.STAGING_RELEASE_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::error::Add STAGING_RELEASE_TOKEN to the source repository Actions secrets."
            exit 1
          fi

          package_version="$(node -p "require('./package.json').version")"
          node scripts/staging-promotion-policy.mjs validate-source-train \
            --source-version "$package_version" \
            --target-version "$TARGET_VERSION" >/dev/null

          visibility="$(gh api "repos/$TARGET_REPOSITORY" --jq '.visibility')"
          if [[ "$visibility" != "public" ]]; then
            echo "::error::$TARGET_REPOSITORY must be public so packaged apps can read update metadata without embedding a GitHub token."
            exit 1
          fi

          gh release list \
            --repo "$TARGET_REPOSITORY" \
            --limit 100 \
            --json tagName,isDraft,isPrerelease > "$RUNNER_TEMP/staging-releases.json"
          node scripts/staging-promotion-policy.mjs assert-next-attempt \
            --releases "$RUNNER_TEMP/staging-candidate-identities.json" \
            --target-version "$TARGET_VERSION" \
            --attempt "$STAGING_ATTEMPT"

          if gh release view "$STAGING_TAG" --repo "$TARGET_REPOSITORY" >/dev/null 2>&1 \
            || gh api "repos/$TARGET_REPOSITORY/git/ref/tags/$STAGING_TAG" >/dev/null 2>&1; then
            echo "::error::Staging release or tag $STAGING_TAG appeared after candidate resolution. Run the workflow again to resolve the next immutable number."
            exit 1
          fi

          promoted_from_file=""
          if [[ "$STAGING_CHANNEL" == "stable" ]]; then
            if [[ -z "$STABLE_PARENT_BETA_TAG" ]]; then
              echo "::error::A Stable RC requires stable_parent_beta_tag. Enter the exact tested Beta staging release."
              exit 1
            fi

            promoted_dir="$RUNNER_TEMP/promoted-from-beta"
            mkdir -p "$promoted_dir"
            gh release view "$STABLE_PARENT_BETA_TAG" \
              --repo "$TARGET_REPOSITORY" \
              --json tagName,isDraft,isPrerelease,url \
              > "$promoted_dir/release.json"
            PROMOTED_FROM_BETA_TAG="$STABLE_PARENT_BETA_TAG" \
            node - <<'NODE'
            const fs = require("fs");
            const release = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/promoted-from-beta/release.json", "utf8"));
            if (
              release.tagName !== process.env.PROMOTED_FROM_BETA_TAG
              || release.isDraft
              || !release.isPrerelease
            ) {
              throw new Error("The selected Beta parent must be a published TestProduction prerelease.");
            }
          NODE

            gh release download "$STABLE_PARENT_BETA_TAG" \
              --repo "$TARGET_REPOSITORY" \
              --pattern staging-source.json \
              --dir "$promoted_dir"
            node scripts/staging-promotion-policy.mjs validate-candidate \
              --file "$promoted_dir/staging-source.json" \
              --expected-tag "$STABLE_PARENT_BETA_TAG" \
              --expected-channel beta >/dev/null

            beta_target="$(node scripts/staging-promotion-policy.mjs field --file "$promoted_dir/staging-source.json" --name targetVersion)"
            beta_source="$(node scripts/staging-promotion-policy.mjs field --file "$promoted_dir/staging-source.json" --name sourceCommit)"
            beta_repository="$(node scripts/staging-promotion-policy.mjs field --file "$promoted_dir/staging-source.json" --name sourceRepository)"
            if [[ "${beta_target%%-*}" != "$TARGET_VERSION" ]]; then
              echo "::error::Beta target $beta_target cannot be promoted to Stable $TARGET_VERSION."
              exit 1
            fi
            if [[ "$beta_repository" != "$GITHUB_REPOSITORY" ]]; then
              echo "::error::Beta candidate source repository mismatch: $beta_repository"
              exit 1
            fi
            node scripts/staging-promotion-policy.mjs assert-current-candidate \
              --releases "$RUNNER_TEMP/staging-releases.json" \
              --target-version "$beta_target" \
              --candidate-tag "$STABLE_PARENT_BETA_TAG" >/dev/null
            if ! git merge-base --is-ancestor "$beta_source" "$SOURCE_SHA"; then
              echo "::error::Stable source $SOURCE_SHA does not descend from Beta source $beta_source."
              exit 1
            fi

            promoted_from_file="$promoted_dir/staging-source.json"
            changed_files="$(git diff --name-status "$beta_source" "$SOURCE_SHA" || true)"
            {
              echo "## Beta → Stable RC lineage"
              echo ""
              echo "- Beta candidate: \`$STABLE_PARENT_BETA_TAG\`"
              echo "- Beta source: \`$beta_source\`"
              echo "- Stable RC source: \`$SOURCE_SHA\`"
              echo ""
              echo "### Changes after the tested Beta"
              echo ""
              echo '```text'
              if [[ -n "$changed_files" ]]; then
                printf '%s\n' "$changed_files"
              else
                echo "No source-tree changes."
              fi
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          elif [[ -n "$STABLE_PARENT_BETA_TAG" ]]; then
            echo "::error::stable_parent_beta_tag is only valid for the Stable channel."
            exit 1
          fi

          echo "promoted_from_file=$promoted_from_file" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare staging identity
        env:
          STAGING_VERSION: ${{ steps.candidate.outputs.version }}
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require("fs");

          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          pkg.version = process.env.STAGING_VERSION;
          fs.writeFileSync("package.json", `${JSON.stringify(pkg, null, 2)}\n`);
          NODE

      - name: Setup macOS signing identity
        id: macos_signing
        uses: ./.github/actions/setup-macos-signing
        with:
          p12-base64: ${{ secrets.MACOS_SIGNING_P12_BASE64 }}
          p12-password: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
          identity: BDIH Launcher Update Signing

      - name: Build staging candidate
        env:
          PUBLISH_REPOSITORY: ${{ env.TARGET_REPOSITORY }}
          BDIH_STAGING_VERSION: ${{ steps.candidate.outputs.version }}
          BDIH_STAGING_CHANNEL: ${{ steps.candidate.outputs.channel }}
          BDIH_STAGING_SOURCE_COMMIT: ${{ steps.candidate.outputs.source_sha }}
          BDIH_DISCORD_CLIENT_ID: ""
        run: |
          set -euo pipefail
          pnpm build
          pnpm exec electron-builder \
            --mac \
            --arm64 \
            --publish never \
            --config electron-builder.staging.config.cjs

      - name: Verify staging package
        env:
          MACOS_SIGNING_IDENTITY: BDIH Launcher Update Signing
          STAGING_CHANNEL: ${{ steps.candidate.outputs.channel }}
        run: |
          set -euo pipefail

          app_path="$(find release -mindepth 2 -maxdepth 2 -type d -name 'BDIH Launcher Staging.app' -print -quit)"
          if [[ -z "$app_path" ]]; then
            echo "::error::No packaged staging application was found."
            exit 1
          fi

          codesign --verify --deep --strict --verbose=2 "$app_path"
          signature="$(codesign -dv --verbose=4 "$app_path" 2>&1)"
          if [[ "$signature" != *"Authority=$MACOS_SIGNING_IDENTITY"* ]]; then
            echo "::error::The staging app was not signed by $MACOS_SIGNING_IDENTITY."
            printf '%s\n' "$signature"
            exit 1
          fi

          expected_metadata="$([[ "$STAGING_CHANNEL" == "stable" ]] && echo latest-mac.yml || echo beta-mac.yml)"
          for required in \
            "release/BDIH-Launcher-Staging-${{ steps.candidate.outputs.channel_label }}-${{ steps.candidate.outputs.version }}.dmg" \
            "release/BDIH-Launcher-Staging-${{ steps.candidate.outputs.channel_label }}-${{ steps.candidate.outputs.version }}.zip" \
            "release/$expected_metadata"; do
            if [[ ! -f "$required" ]]; then
              echo "::error::Missing staging artifact: $required"
              exit 1
            fi
          done

      - name: Cleanup macOS signing identity
        if: ${{ always() && steps.macos_signing.outcome == 'success' }}
        env:
          CERTIFICATE_SHA1: ${{ steps.macos_signing.outputs.certificate-sha1 }}
          KEYCHAIN_PATH: ${{ steps.macos_signing.outputs.keychain-path }}
          SIGNING_TEMP_DIR: ${{ steps.macos_signing.outputs.temp-dir }}
        run: |
          set +e
          sudo -n security delete-certificate \
            -Z "$CERTIFICATE_SHA1" \
            /Library/Keychains/System.keychain >/dev/null 2>&1
          security delete-keychain "$KEYCHAIN_PATH" >/dev/null 2>&1
          find "$SIGNING_TEMP_DIR" -type f -delete >/dev/null 2>&1
          rmdir "$SIGNING_TEMP_DIR" >/dev/null 2>&1

      - name: Update staging release anchor
        env:
          GH_TOKEN: ${{ secrets.STAGING_RELEASE_TOKEN }}
          STAGING_TAG: ${{ steps.candidate.outputs.tag }}
          STAGING_VERSION: ${{ steps.candidate.outputs.version }}
          STAGING_TARGET_VERSION: ${{ steps.candidate.outputs.target_version }}
          STAGING_ATTEMPT: ${{ steps.candidate.outputs.attempt }}
          STAGING_CHANNEL: ${{ steps.candidate.outputs.channel }}
          SOURCE_SHA: ${{ steps.candidate.outputs.source_sha }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_RUN_URL: ${{ steps.candidate.outputs.source_run_url }}
          CREATED_AT: ${{ steps.candidate.outputs.created_at }}
          PROMOTED_FROM_FILE: ${{ steps.lineage.outputs.promoted_from_file }}
        run: |
          set -euo pipefail

          anchor_dir="$(mktemp -d)"
          trap 'rm -rf "$anchor_dir"' EXIT
          cd "$anchor_dir"

          git init
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${TARGET_REPOSITORY}.git"

          if git fetch --depth=1 origin "$TARGET_STAGING_BRANCH"; then
            git checkout -b "$TARGET_STAGING_BRANCH" FETCH_HEAD
          else
            git checkout -b "$TARGET_STAGING_BRANCH"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf .github/workflows

          node <<'NODE'
          const fs = require("fs");

          const promotedFrom = process.env.PROMOTED_FROM_FILE
            ? JSON.parse(fs.readFileSync(process.env.PROMOTED_FROM_FILE, "utf8"))
            : null;

          const metadata = {
            schemaVersion: 1,
            version: process.env.STAGING_VERSION,
            targetVersion: process.env.STAGING_TARGET_VERSION,
            attempt: Number(process.env.STAGING_ATTEMPT),
            tag: process.env.STAGING_TAG,
            channel: process.env.STAGING_CHANNEL,
            sourceRepository: process.env.GITHUB_REPOSITORY,
            sourceCommit: process.env.SOURCE_SHA,
            sourceRunId: process.env.SOURCE_RUN_ID,
            sourceRunUrl: process.env.SOURCE_RUN_URL,
            createdAt: process.env.CREATED_AT,
            promotedFrom,
          };

          fs.writeFileSync("candidate-source.json", `${JSON.stringify(metadata, null, 2)}\n`);
          if (!fs.existsSync("README.md")) {
            fs.writeFileSync("README.md", [
              "# BDIH Launcher TestProduction",
              "",
              "This branch anchors Stable and Beta staging releases.",
              "Source commits are recorded in candidate-source.json and each release.",
              "",
            ].join("\n"));
          }
          NODE
          node "$GITHUB_WORKSPACE/scripts/staging-promotion-policy.mjs" validate-candidate \
            --file candidate-source.json >/dev/null

          git add README.md candidate-source.json
          if git diff --cached --quiet; then
            echo "Staging release anchor already records $STAGING_TAG."
          else
            git commit -m "Stage $STAGING_TAG from $SOURCE_SHA"
            git push origin "HEAD:refs/heads/${TARGET_STAGING_BRANCH}"
          fi

      - name: Publish staging release
        env:
          GH_TOKEN: ${{ secrets.STAGING_RELEASE_TOKEN }}
          STAGING_TAG: ${{ steps.candidate.outputs.tag }}
          STAGING_VERSION: ${{ steps.candidate.outputs.version }}
          STAGING_TARGET_VERSION: ${{ steps.candidate.outputs.target_version }}
          STAGING_ATTEMPT: ${{ steps.candidate.outputs.attempt }}
          STAGING_CHANNEL: ${{ steps.candidate.outputs.channel }}
          STAGING_CHANNEL_LABEL: ${{ steps.candidate.outputs.channel_label }}
          SOURCE_SHA: ${{ steps.candidate.outputs.source_sha }}
          SOURCE_SHORT_SHA: ${{ steps.candidate.outputs.source_short_sha }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_RUN_URL: ${{ steps.candidate.outputs.source_run_url }}
          CREATED_AT: ${{ steps.candidate.outputs.created_at }}
          PROMOTED_FROM_FILE: ${{ steps.lineage.outputs.promoted_from_file }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          node <<'NODE'
          const fs = require("fs");

          const promotedFrom = process.env.PROMOTED_FROM_FILE
            ? JSON.parse(fs.readFileSync(process.env.PROMOTED_FROM_FILE, "utf8"))
            : null;

          const metadata = {
            schemaVersion: 1,
            version: process.env.STAGING_VERSION,
            targetVersion: process.env.STAGING_TARGET_VERSION,
            attempt: Number(process.env.STAGING_ATTEMPT),
            tag: process.env.STAGING_TAG,
            channel: process.env.STAGING_CHANNEL,
            sourceRepository: process.env.GITHUB_REPOSITORY,
            sourceCommit: process.env.SOURCE_SHA,
            sourceRunId: process.env.SOURCE_RUN_ID,
            sourceRunUrl: process.env.SOURCE_RUN_URL,
            createdAt: process.env.CREATED_AT,
            promotedFrom,
          };

          fs.writeFileSync("release/staging-source.json", `${JSON.stringify(metadata, null, 2)}\n`);
          fs.writeFileSync("release-notes.md", [
            `BDIH Launcher ${metadata.channel} staging candidate.`,
            "",
            `Source repository: ${metadata.sourceRepository}`,
            `Source commit: ${metadata.sourceCommit}`,
            `Production target: ${metadata.targetVersion}`,
            `Attempt: ${metadata.attempt}`,
            `Version: ${metadata.version}`,
            ...(metadata.promotedFrom ? [
              `Promoted from Beta: ${metadata.promotedFrom.tag}`,
              `Beta source commit: ${metadata.promotedFrom.sourceCommit}`,
            ] : []),
            "",
          ].join("\n"));
          NODE
          node scripts/staging-promotion-policy.mjs validate-candidate \
            --file release/staging-source.json >/dev/null

          assets=(release/*.dmg release/*.zip release/*.yml release/*.blockmap release/staging-source.json)
          if (( ${#assets[@]} == 0 )); then
            echo "::error::No staging release assets were generated."
            exit 1
          fi

          release_args=(--draft)
          if [[ "$STAGING_CHANNEL" == "beta" ]]; then
            release_args+=(--prerelease)
          fi

          gh release create "$STAGING_TAG" "${assets[@]}" \
            --repo "$TARGET_REPOSITORY" \
            --target "$TARGET_STAGING_BRANCH" \
            --title "BDIH Launcher Staging $STAGING_CHANNEL_LABEL $STAGING_VERSION ($SOURCE_SHORT_SHA)" \
            --notes-file release-notes.md \
            "${release_args[@]}"

          publish_args=(--draft=false)
          if [[ "$STAGING_CHANNEL" == "stable" ]]; then
            publish_args+=(--latest)
          fi
          gh release edit "$STAGING_TAG" \
            --repo "$TARGET_REPOSITORY" \
            "${publish_args[@]}"

  queue_production_promotion:
    name: Queue Production approval
    needs: staging
    if: ${{ needs.staging.outputs.promotable == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Queue the candidate for approval
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_TAG: ${{ needs.staging.outputs.tag }}
          CANDIDATE_VERSION: ${{ needs.staging.outputs.version }}
          TARGET_VERSION: ${{ needs.staging.outputs.target_version }}
          CANDIDATE_CHANNEL: ${{ needs.staging.outputs.channel }}
          CANDIDATE_ATTEMPT: ${{ needs.staging.outputs.attempt }}
          SOURCE_SHA: ${{ needs.staging.outputs.source_sha }}
          SOURCE_RUN_URL: ${{ needs.staging.outputs.source_run_url }}
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require("fs");
          fs.writeFileSync("dispatch.json", `${JSON.stringify({
            event_type: "production_candidate_created",
            client_payload: {
              candidate_tag: process.env.CANDIDATE_TAG,
              candidate_version: process.env.CANDIDATE_VERSION,
              target_version: process.env.TARGET_VERSION,
              channel: process.env.CANDIDATE_CHANNEL,
              attempt: Number(process.env.CANDIDATE_ATTEMPT),
              source_commit: process.env.SOURCE_SHA,
              source_run_url: process.env.SOURCE_RUN_URL,
            },
          })}\n`);
          NODE

          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/dispatches" \
            --input dispatch.json
