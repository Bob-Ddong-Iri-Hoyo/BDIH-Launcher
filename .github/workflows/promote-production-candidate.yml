name: Production Release

on:
  repository_dispatch:
    types:
      - production_candidate_created
  workflow_dispatch:
    inputs:
      candidate_tag:
        description: "Existing published TestProduction candidate tag to requeue"
        required: true
        type: string

concurrency:
  group: production-release-${{ inputs.candidate_tag || github.event.client_payload.target_version }}
  cancel-in-progress: true

env:
  STAGING_REPOSITORY: Bob-Ddong-Iri-Hoyo/BDIH-Launcher-TestProduction
  SOURCE_BRANCH: main

jobs:
  requeue_candidate:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    name: Requeue ${{ inputs.candidate_tag }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout trusted promotion policy
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: Validate and requeue the existing candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
        run: |
          set -euo pipefail

          candidate_dir="$RUNNER_TEMP/requeue-candidate"
          mkdir -p "$candidate_dir"

          gh release view "$CANDIDATE_TAG" \
            --repo "$STAGING_REPOSITORY" \
            --json tagName,isDraft,isPrerelease,url \
            > "$candidate_dir/release.json"
          gh release download "$CANDIDATE_TAG" \
            --repo "$STAGING_REPOSITORY" \
            --pattern staging-source.json \
            --dir "$candidate_dir"

          node scripts/staging-promotion-policy.mjs validate-candidate \
            --file "$candidate_dir/staging-source.json" \
            --expected-tag "$CANDIDATE_TAG" \
            > /dev/null

          candidate_version="$(node scripts/staging-promotion-policy.mjs field \
            --file "$candidate_dir/staging-source.json" --name version)"
          target_version="$(node scripts/staging-promotion-policy.mjs field \
            --file "$candidate_dir/staging-source.json" --name targetVersion)"
          candidate_attempt="$(node scripts/staging-promotion-policy.mjs field \
            --file "$candidate_dir/staging-source.json" --name attempt)"
          candidate_channel="$(node scripts/staging-promotion-policy.mjs field \
            --file "$candidate_dir/staging-source.json" --name channel)"
          source_repository="$(node scripts/staging-promotion-policy.mjs field \
            --file "$candidate_dir/staging-source.json" --name sourceRepository)"
          source_commit="$(node scripts/staging-promotion-policy.mjs field \
            --file "$candidate_dir/staging-source.json" --name sourceCommit)"
          source_run_url="$(node scripts/staging-promotion-policy.mjs field \
            --file "$candidate_dir/staging-source.json" --name sourceRunUrl)"

          if [[ "$source_repository" != "$GITHUB_REPOSITORY" ]]; then
            echo "::error::Candidate source repository mismatch: $source_repository"
            exit 1
          fi

          CANDIDATE_CHANNEL="$candidate_channel" node - <<'NODE'
          const fs = require("fs");
          const release = JSON.parse(fs.readFileSync(
            process.env.RUNNER_TEMP + "/requeue-candidate/release.json",
            "utf8",
          ));
          const expectedPrerelease = process.env.CANDIDATE_CHANNEL === "beta";
          if (
            release.tagName !== process.env.CANDIDATE_TAG
            || release.isDraft
            || release.isPrerelease !== expectedPrerelease
          ) {
            throw new Error("The selected TestProduction candidate has the wrong GitHub release state.");
          }
          NODE

          gh release list \
            --repo "$STAGING_REPOSITORY" \
            --limit 100 \
            --json tagName,isDraft,isPrerelease \
            > "$candidate_dir/releases.json"
          node scripts/staging-promotion-policy.mjs assert-current-candidate \
            --releases "$candidate_dir/releases.json" \
            --target-version "$target_version" \
            --candidate-tag "$CANDIDATE_TAG" \
            > /dev/null

          git fetch origin "refs/heads/$SOURCE_BRANCH:refs/remotes/origin/$SOURCE_BRANCH" --force
          if ! git merge-base --is-ancestor "$source_commit" "origin/$SOURCE_BRANCH"; then
            echo "::error::Candidate source $source_commit is not reachable from origin/$SOURCE_BRANCH."
            exit 1
          fi
          if ! git diff --quiet "$source_commit" "origin/$SOURCE_BRANCH" -- .github/workflows; then
            echo "::error::Candidate source $source_commit predates Production workflow changes. Publish the next TestProduction attempt from the current $SOURCE_BRANCH."
            exit 1
          fi

          CANDIDATE_VERSION="$candidate_version" \
          TARGET_VERSION="$target_version" \
          CANDIDATE_ATTEMPT="$candidate_attempt" \
          CANDIDATE_CHANNEL="$candidate_channel" \
          SOURCE_COMMIT="$source_commit" \
          SOURCE_RUN_URL="$source_run_url" \
          node <<'NODE'
          const fs = require("fs");
          fs.writeFileSync("dispatch.json", `${JSON.stringify({
            event_type: "production_candidate_created",
            client_payload: {
              candidate_tag: process.env.CANDIDATE_TAG,
              candidate_version: process.env.CANDIDATE_VERSION,
              target_version: process.env.TARGET_VERSION,
              channel: process.env.CANDIDATE_CHANNEL,
              attempt: Number(process.env.CANDIDATE_ATTEMPT),
              source_commit: process.env.SOURCE_COMMIT,
              source_run_url: process.env.SOURCE_RUN_URL,
            },
          })}\n`);
          NODE

          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/dispatches" \
            --input dispatch.json

          {
            echo "## Production candidate requeued"
            echo ""
            echo "- Candidate: \`$candidate_version\`"
            echo "- Tag: \`$CANDIDATE_TAG\`"
            echo "- Target: \`$target_version\`"
            echo "- Source commit: \`$source_commit\`"
          } >> "$GITHUB_STEP_SUMMARY"

  create_production_draft:
    if: ${{ github.event_name == 'repository_dispatch' }}
    name: Draft ${{ github.event.client_payload.target_version }} from ${{ github.event.client_payload.candidate_version }} (${{ github.event.client_payload.channel }})
    runs-on: macos-latest
    permissions:
      actions: read
      contents: write
      deployments: write
    environment:
      name: production-candidate-approval
      url: https://github.com/Bob-Ddong-Iri-Hoyo/BDIH-Launcher-TestProduction/releases/tag/${{ github.event.client_payload.candidate_tag }}
    outputs:
      draft_url: ${{ steps.draft.outputs.draft_url }}
      production_tag: ${{ steps.candidate.outputs.production_tag }}

    steps:
      - name: Checkout trusted promotion policy
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: Require a protected candidate approval environment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          gh api \
            "repos/$GITHUB_REPOSITORY/environments/production-candidate-approval" \
            > "$RUNNER_TEMP/candidate-environment.json"
          reviewer_count="$(node -e '
            const fs = require("fs");
            const environment = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const rule = environment.protection_rules?.find((entry) => entry.type === "required_reviewers");
            process.stdout.write(String(rule?.reviewers?.length ?? 0));
          ' "$RUNNER_TEMP/candidate-environment.json")"

          if [[ "$reviewer_count" -lt 1 ]]; then
            echo "::error::Configure at least one required reviewer on the production-candidate-approval environment."
            exit 1
          fi

      - name: Validate the selected TestProduction candidate
        id: candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_TAG: ${{ github.event.client_payload.candidate_tag }}
          CANDIDATE_VERSION: ${{ github.event.client_payload.candidate_version }}
          TARGET_VERSION: ${{ github.event.client_payload.target_version }}
          CANDIDATE_CHANNEL: ${{ github.event.client_payload.channel }}
          SOURCE_SHA: ${{ github.event.client_payload.source_commit }}
          SOURCE_RUN_URL: ${{ github.event.client_payload.source_run_url }}
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/candidate"
          gh release view "$CANDIDATE_TAG" \
            --repo "$STAGING_REPOSITORY" \
            --json tagName,isDraft,isPrerelease,url \
            > "$RUNNER_TEMP/candidate/release.json"

          node - <<'NODE'
          const fs = require("fs");
          const release = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/candidate/release.json", "utf8"));
          const expectedPrerelease = process.env.CANDIDATE_CHANNEL === "beta";
          if (
            release.tagName !== process.env.CANDIDATE_TAG
            || release.isDraft
            || release.isPrerelease !== expectedPrerelease
          ) {
            throw new Error(`The selected ${process.env.CANDIDATE_CHANNEL} candidate has the wrong GitHub release state.`);
          }
          NODE

          gh release list \
            --repo "$STAGING_REPOSITORY" \
            --limit 100 \
            --json tagName,isDraft,isPrerelease > "$RUNNER_TEMP/candidate/releases.json"
          node scripts/staging-promotion-policy.mjs assert-current-candidate \
            --releases "$RUNNER_TEMP/candidate/releases.json" \
            --target-version "$TARGET_VERSION" \
            --candidate-tag "$CANDIDATE_TAG"

          gh release download "$CANDIDATE_TAG" \
            --repo "$STAGING_REPOSITORY" \
            --pattern staging-source.json \
            --dir "$RUNNER_TEMP/candidate"
          node scripts/staging-promotion-policy.mjs validate-candidate \
            --file "$RUNNER_TEMP/candidate/staging-source.json" \
            --expected-tag "$CANDIDATE_TAG" \
            --expected-version "$CANDIDATE_VERSION" \
            --expected-target-version "$TARGET_VERSION" \
            --expected-source-commit "$SOURCE_SHA" \
            --expected-channel "$CANDIDATE_CHANNEL"

          metadata_repository="$(node scripts/staging-promotion-policy.mjs field --file "$RUNNER_TEMP/candidate/staging-source.json" --name sourceRepository)"
          if [[ "$metadata_repository" != "$GITHUB_REPOSITORY" ]]; then
            echo "::error::Candidate source repository mismatch: $metadata_repository"
            exit 1
          fi

          git fetch origin "refs/heads/$SOURCE_BRANCH:refs/remotes/origin/$SOURCE_BRANCH" --force
          if ! git merge-base --is-ancestor "$SOURCE_SHA" "origin/$SOURCE_BRANCH"; then
            echo "::error::Candidate source $SOURCE_SHA is not reachable from origin/$SOURCE_BRANCH."
            exit 1
          fi
          if ! git diff --quiet "$SOURCE_SHA" "origin/$SOURCE_BRANCH" -- .github/workflows; then
            echo "::error::Candidate source $SOURCE_SHA predates Production workflow changes. Publish the next TestProduction attempt from the current $SOURCE_BRANCH."
            exit 1
          fi

          if [[ "$CANDIDATE_CHANNEL" == "stable" ]]; then
            promoted_tag="$(node scripts/staging-promotion-policy.mjs field --file "$RUNNER_TEMP/candidate/staging-source.json" --name promotedFrom.tag)"
            promoted_source="$(node scripts/staging-promotion-policy.mjs field --file "$RUNNER_TEMP/candidate/staging-source.json" --name promotedFrom.sourceCommit)"
            promoted_version="$(node scripts/staging-promotion-policy.mjs field --file "$RUNNER_TEMP/candidate/staging-source.json" --name promotedFrom.version)"
            promoted_dir="$RUNNER_TEMP/promoted-from-beta"
            mkdir -p "$promoted_dir"
            gh release view "$promoted_tag" \
              --repo "$STAGING_REPOSITORY" \
              --json tagName,isDraft,isPrerelease \
              > "$promoted_dir/release.json"
            node - <<'NODE'
            const fs = require("fs");
            const release = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/promoted-from-beta/release.json", "utf8"));
            if (release.isDraft || !release.isPrerelease) {
              throw new Error("Promoted Beta lineage must still reference a published prerelease.");
            }
          NODE
            gh release download "$promoted_tag" \
              --repo "$STAGING_REPOSITORY" \
              --pattern staging-source.json \
              --dir "$promoted_dir"
            node scripts/staging-promotion-policy.mjs validate-lineage \
              --candidate "$RUNNER_TEMP/candidate/staging-source.json" \
              --promoted-from "$promoted_dir/staging-source.json" >/dev/null
            if ! git merge-base --is-ancestor "$promoted_source" "$SOURCE_SHA"; then
              echo "::error::Stable source $SOURCE_SHA no longer descends from promoted Beta source $promoted_source."
              exit 1
            fi

            changed_files="$(git diff --name-status "$promoted_source" "$SOURCE_SHA" || true)"
            {
              echo ""
              echo "### Beta → Stable source lineage"
              echo ""
              echo "- Beta candidate: [\`$promoted_version\`](https://github.com/$STAGING_REPOSITORY/releases/tag/$promoted_tag)"
              echo "- Beta source: \`$promoted_source\`"
              echo "- Stable RC source: \`$SOURCE_SHA\`"
              echo ""
              echo '```text'
              if [[ -n "$changed_files" ]]; then
                printf '%s\n' "$changed_files"
              else
                echo "No source-tree changes."
              fi
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          git show "$SOURCE_SHA:package.json" > "$RUNNER_TEMP/candidate-package.json"
          package_version="$(node -e '
            const fs = require("fs");
            process.stdout.write(JSON.parse(fs.readFileSync(process.argv[1], "utf8")).version);
          ' "$RUNNER_TEMP/candidate-package.json")"
          node scripts/staging-promotion-policy.mjs validate-source-train \
            --source-version "$package_version" \
            --target-version "$TARGET_VERSION" >/dev/null

          production_tag="v${TARGET_VERSION}"
          replace_draft="false"
          if gh release view "$production_tag" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease > "$RUNNER_TEMP/existing-production.json" 2>/dev/null; then
            existing_state="$(node -e '
              const fs = require("fs");
              const release = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
              process.stdout.write(`${release.isDraft}\t${release.isPrerelease}`);
            ' "$RUNNER_TEMP/existing-production.json")"
            expected_state="$([[ "$CANDIDATE_CHANNEL" == "beta" ]] && printf 'true\ttrue' || printf 'true\tfalse')"
            if [[ "$existing_state" != "$expected_state" ]]; then
              echo "::error::Published Production release $production_tag already exists."
              exit 1
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/$production_tag" >/dev/null 2>&1; then
              echo "::error::Production tag $production_tag already exists. Draft tags are immutable and cannot be replaced."
              exit 1
            fi
            replace_draft="true"
          elif git ls-remote --exit-code --tags origin "refs/tags/$production_tag" >/dev/null 2>&1; then
            echo "::error::Production tag $production_tag already exists without a replaceable Draft."
            exit 1
          fi

          {
            echo "production_tag=$production_tag"
            echo "replace_draft=$replace_draft"
            echo "candidate_file=$RUNNER_TEMP/candidate/staging-source.json"
            echo "candidate_url=https://github.com/$STAGING_REPOSITORY/releases/tag/$CANDIDATE_TAG"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Production Draft Approval"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Production target | \`$TARGET_VERSION\` |"
            echo "| Channel | \`$CANDIDATE_CHANNEL\` |"
            echo "| Selected candidate | [\`$CANDIDATE_VERSION\`](https://github.com/$STAGING_REPOSITORY/releases/tag/$CANDIDATE_TAG) |"
            echo "| Source commit | \`$SOURCE_SHA\` |"
            echo "| Staging run | $SOURCE_RUN_URL |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout the exact approved candidate source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.source_commit }}
          fetch-depth: 0
          fetch-tags: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare Production package version
        env:
          TARGET_VERSION: ${{ github.event.client_payload.target_version }}
        run: |
          set -euo pipefail

          node scripts/staging-promotion-policy.mjs prepare-production-package \
            --file package.json \
            --target-version "$TARGET_VERSION"

          actual_version="$(node -p "require('./package.json').version")"
          if [[ "$actual_version" != "$TARGET_VERSION" ]]; then
            echo "::error::Failed to inject Production version $TARGET_VERSION into package.json."
            exit 1
          fi

      - name: Setup macOS signing identity
        id: macos_signing
        uses: ./.github/actions/setup-macos-signing
        with:
          p12-base64: ${{ secrets.MACOS_SIGNING_P12_BASE64 }}
          p12-password: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
          identity: BDIH Launcher Update Signing

      - name: Build Production draft assets
        env:
          PUBLISH_REPOSITORY: ${{ github.repository }}
          UPDATE_CHANNEL: ${{ github.event.client_payload.channel == 'beta' && 'beta' || 'latest' }}
          RELEASE_TYPE: ${{ github.event.client_payload.channel == 'beta' && 'prerelease' || 'release' }}
          BDIH_REQUIRE_CODE_SIGNING: "true"
          BDIH_DISCORD_CLIENT_ID: ${{ vars.BDIH_DISCORD_CLIENT_ID || secrets.BDIH_DISCORD_CLIENT_ID }}
          BDIH_DISCORD_SHOW_IDLE: ${{ vars.BDIH_DISCORD_SHOW_IDLE || 'true' }}
          BDIH_DISCORD_LARGE_IMAGE_KEY: ${{ vars.BDIH_DISCORD_LARGE_IMAGE_KEY || 'bdih_logo' }}
        run: |
          set -euo pipefail
          if [[ -z "${BDIH_DISCORD_CLIENT_ID:-}" ]]; then
            echo "::warning::BDIH_DISCORD_CLIENT_ID is not set; Discord Rich Presence will be disabled in this build."
          fi
          pnpm build
          pnpm exec electron-builder \
            --mac \
            --arm64 \
            --publish never \
            --config electron-builder.config.cjs

      - name: Verify Production draft assets
        env:
          MACOS_SIGNING_IDENTITY: BDIH Launcher Update Signing
          TARGET_VERSION: ${{ github.event.client_payload.target_version }}
          CANDIDATE_CHANNEL: ${{ github.event.client_payload.channel }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          app_path="$(find release -mindepth 2 -maxdepth 2 -type d -name 'BDIH Launcher.app' -print -quit)"
          if [[ -z "$app_path" ]]; then
            echo "::error::No packaged Production application was found."
            exit 1
          fi

          codesign --verify --deep --strict --verbose=2 "$app_path"
          signature="$(codesign -dv --verbose=4 "$app_path" 2>&1)"
          if [[ "$signature" != *"Authority=$MACOS_SIGNING_IDENTITY"* ]]; then
            echo "::error::The Production app was not signed by $MACOS_SIGNING_IDENTITY."
            printf '%s\n' "$signature"
            exit 1
          fi
          codesign -dr - "$app_path"
          bash scripts/verifyMacosSigningBridge.sh "$app_path"

          dmgs=(release/*.dmg)
          zips=(release/*.zip)
          blockmaps=(release/*.blockmap)
          if (( ${#dmgs[@]} == 0 || ${#zips[@]} == 0 || ${#blockmaps[@]} == 0 )); then
            echo "::error::Production draft is missing a DMG, ZIP, or blockmap."
            exit 1
          fi
          metadata_name="$([[ "$CANDIDATE_CHANNEL" == "beta" ]] && echo beta-mac.yml || echo latest-mac.yml)"
          if [[ ! -f "release/$metadata_name" ]]; then
            echo "::error::Production draft is missing $metadata_name."
            exit 1
          fi
          if ! grep -Eq "^version: ['\"]?${TARGET_VERSION//./\\.}['\"]?$" "release/$metadata_name"; then
            echo "::error::$metadata_name does not describe Production $TARGET_VERSION."
            exit 1
          fi

      - name: Create unpublished Production draft
        id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_TAG: ${{ github.event.client_payload.candidate_tag }}
          CANDIDATE_VERSION: ${{ github.event.client_payload.candidate_version }}
          TARGET_VERSION: ${{ github.event.client_payload.target_version }}
          CANDIDATE_CHANNEL: ${{ github.event.client_payload.channel }}
          SOURCE_SHA: ${{ github.event.client_payload.source_commit }}
          PRODUCTION_TAG: ${{ steps.candidate.outputs.production_tag }}
          REPLACE_DRAFT: ${{ steps.candidate.outputs.replace_draft }}
          CANDIDATE_FILE: ${{ steps.candidate.outputs.candidate_file }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          node scripts/staging-promotion-policy.mjs create-provenance \
            --candidate "$CANDIDATE_FILE" \
            --production-tag "$PRODUCTION_TAG" \
            --asset-directory release \
            --output release/promotion-source.json

          if [[ "$REPLACE_DRAFT" == "true" ]]; then
            existing_state="$(gh release view "$PRODUCTION_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease --jq '[.isDraft, .isPrerelease] | @tsv')"
            expected_state="$([[ "$CANDIDATE_CHANNEL" == "beta" ]] && printf 'true\ttrue' || printf 'true\tfalse')"
            if [[ "$existing_state" != "$expected_state" ]]; then
              echo "::error::The previous Production Draft changed while the replacement was building."
              exit 1
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/$PRODUCTION_TAG" >/dev/null 2>&1; then
              echo "::error::Production tag $PRODUCTION_TAG appeared while the replacement was building."
              exit 1
            fi
            gh release delete "$PRODUCTION_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --yes
          fi

          cat > release-notes.md <<EOF
          Production $CANDIDATE_CHANNEL promoted from a verified TestProduction candidate.

          - Production version: \`$TARGET_VERSION\`
          - Staging candidate: \`$CANDIDATE_VERSION\`
          - Candidate release: https://github.com/$STAGING_REPOSITORY/releases/tag/$CANDIDATE_TAG
          - Source commit: \`$SOURCE_SHA\`

          This release remains a Draft until the separate Production publish approval succeeds.
          EOF

          metadata_name="$([[ "$CANDIDATE_CHANNEL" == "beta" ]] && echo beta-mac.yml || echo latest-mac.yml)"
          assets=(release/*.dmg release/*.zip "release/$metadata_name" release/*.blockmap release/promotion-source.json)
          release_args=(--draft --latest=false)
          if [[ "$CANDIDATE_CHANNEL" == "beta" ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "$PRODUCTION_TAG" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --title "BDIH Launcher $TARGET_VERSION — Draft from $CANDIDATE_VERSION" \
            --notes-file release-notes.md \
            "${release_args[@]}"

          draft_url="$(gh release view "$PRODUCTION_TAG" --repo "$GITHUB_REPOSITORY" --json url --jq '.url')"
          echo "draft_url=$draft_url" >> "$GITHUB_OUTPUT"
          {
            echo ""
            echo "### Draft created"
            echo ""
            echo "[$PRODUCTION_TAG Production Draft]($draft_url)"
            echo ""
            echo "The update feed cannot see this release until the final approval publishes it."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup macOS signing identity
        if: ${{ always() && steps.macos_signing.outcome == 'success' }}
        env:
          CERTIFICATE_SHA1: ${{ steps.macos_signing.outputs.certificate-sha1 }}
          KEYCHAIN_PATH: ${{ steps.macos_signing.outputs.keychain-path }}
          SIGNING_TEMP_DIR: ${{ steps.macos_signing.outputs.temp-dir }}
        run: |
          set +e
          sudo -n security delete-certificate \
            -Z "$CERTIFICATE_SHA1" \
            /Library/Keychains/System.keychain >/dev/null 2>&1
          security delete-keychain "$KEYCHAIN_PATH" >/dev/null 2>&1
          find "$SIGNING_TEMP_DIR" -type f -delete >/dev/null 2>&1
          rmdir "$SIGNING_TEMP_DIR" >/dev/null 2>&1

  publish_production:
    needs: create_production_draft
    name: Publish ${{ github.event.client_payload.target_version }} from ${{ github.event.client_payload.candidate_version }} (${{ github.event.client_payload.channel }})
    runs-on: macos-latest
    permissions:
      actions: read
      contents: write
      deployments: write
    environment:
      name: production-release
      url: ${{ needs.create_production_draft.outputs.draft_url }}

    steps:
      - name: Checkout trusted publication policy
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: Require a protected Production environment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          gh api \
            "repos/$GITHUB_REPOSITORY/environments/production-release" \
            > "$RUNNER_TEMP/production-environment.json"
          reviewer_count="$(node -e '
            const fs = require("fs");
            const environment = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const rule = environment.protection_rules?.find((entry) => entry.type === "required_reviewers");
            process.stdout.write(String(rule?.reviewers?.length ?? 0));
          ' "$RUNNER_TEMP/production-environment.json")"

          if [[ "$reviewer_count" -lt 1 ]]; then
            echo "::error::Configure at least one required reviewer on the production-release environment."
            exit 1
          fi

      - name: Download and validate the candidate and Production Draft
        id: validation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_TAG: ${{ github.event.client_payload.candidate_tag }}
          CANDIDATE_VERSION: ${{ github.event.client_payload.candidate_version }}
          TARGET_VERSION: ${{ github.event.client_payload.target_version }}
          CANDIDATE_CHANNEL: ${{ github.event.client_payload.channel }}
          PRODUCTION_TAG: ${{ needs.create_production_draft.outputs.production_tag }}
          SOURCE_SHA: ${{ github.event.client_payload.source_commit }}
        run: |
          set -euo pipefail

          if [[ "$PRODUCTION_TAG" != "v${TARGET_VERSION}" ]]; then
            echo "::error::Production tag $PRODUCTION_TAG does not match target $TARGET_VERSION."
            exit 1
          fi

          git fetch origin "refs/heads/$SOURCE_BRANCH:refs/remotes/origin/$SOURCE_BRANCH" --force
          if ! git merge-base --is-ancestor "$SOURCE_SHA" "origin/$SOURCE_BRANCH"; then
            echo "::error::Approved source $SOURCE_SHA is no longer reachable from origin/$SOURCE_BRANCH."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/production-draft"
          gh release view "$CANDIDATE_TAG" \
            --repo "$STAGING_REPOSITORY" \
            --json tagName,isDraft,isPrerelease \
            > "$RUNNER_TEMP/candidate/release.json"
          node - <<'NODE'
          const fs = require("fs");
          const release = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/candidate/release.json", "utf8"));
          const expectedPrerelease = process.env.CANDIDATE_CHANNEL === "beta";
          if (
            release.tagName !== process.env.CANDIDATE_TAG
            || release.isDraft
            || release.isPrerelease !== expectedPrerelease
          ) {
            throw new Error(`The ${process.env.CANDIDATE_CHANNEL} candidate release state changed after Draft creation.`);
          }
          NODE
          gh release list \
            --repo "$STAGING_REPOSITORY" \
            --limit 100 \
            --json tagName,isDraft,isPrerelease > "$RUNNER_TEMP/candidate/releases.json"
          node scripts/staging-promotion-policy.mjs assert-current-candidate \
            --releases "$RUNNER_TEMP/candidate/releases.json" \
            --target-version "$TARGET_VERSION" \
            --candidate-tag "$CANDIDATE_TAG"
          gh release download "$CANDIDATE_TAG" \
            --repo "$STAGING_REPOSITORY" \
            --pattern staging-source.json \
            --dir "$RUNNER_TEMP/candidate"
          node scripts/staging-promotion-policy.mjs validate-candidate \
            --file "$RUNNER_TEMP/candidate/staging-source.json" \
            --expected-tag "$CANDIDATE_TAG" \
            --expected-version "$CANDIDATE_VERSION" \
            --expected-target-version "$TARGET_VERSION" \
            --expected-source-commit "$SOURCE_SHA" \
            --expected-channel "$CANDIDATE_CHANNEL"

          if [[ "$CANDIDATE_CHANNEL" == "stable" ]]; then
            promoted_tag="$(node scripts/staging-promotion-policy.mjs field --file "$RUNNER_TEMP/candidate/staging-source.json" --name promotedFrom.tag)"
            promoted_source="$(node scripts/staging-promotion-policy.mjs field --file "$RUNNER_TEMP/candidate/staging-source.json" --name promotedFrom.sourceCommit)"
            promoted_version="$(node scripts/staging-promotion-policy.mjs field --file "$RUNNER_TEMP/candidate/staging-source.json" --name promotedFrom.version)"
            promoted_dir="$RUNNER_TEMP/promoted-from-beta"
            mkdir -p "$promoted_dir"
            gh release view "$promoted_tag" \
              --repo "$STAGING_REPOSITORY" \
              --json isDraft,isPrerelease > "$promoted_dir/release.json"
            promoted_state="$(node -e '
              const fs = require("fs");
              const release = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
              process.stdout.write(`${release.isDraft}\t${release.isPrerelease}`);
            ' "$promoted_dir/release.json")"
            if [[ "$promoted_state" != $'false\ttrue' ]]; then
              echo "::error::Promoted Beta lineage no longer references a published prerelease."
              exit 1
            fi
            gh release download "$promoted_tag" \
              --repo "$STAGING_REPOSITORY" \
              --pattern staging-source.json \
              --dir "$promoted_dir"
            node scripts/staging-promotion-policy.mjs validate-lineage \
              --candidate "$RUNNER_TEMP/candidate/staging-source.json" \
              --promoted-from "$promoted_dir/staging-source.json" >/dev/null
            if ! git merge-base --is-ancestor "$promoted_source" "$SOURCE_SHA"; then
              echo "::error::Stable source $SOURCE_SHA no longer descends from Beta source $promoted_source."
              exit 1
            fi

            {
              echo ""
              echo "### Verified Beta → Stable lineage"
              echo ""
              echo "- Beta candidate: [\`$promoted_version\`](https://github.com/$STAGING_REPOSITORY/releases/tag/$promoted_tag)"
              echo "- Beta source: \`$promoted_source\`"
              echo "- Stable RC source: \`$SOURCE_SHA\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          gh release view "$PRODUCTION_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease,targetCommitish,url \
            > "$RUNNER_TEMP/production-draft/release.json"
          node - <<'NODE'
          const fs = require("fs");
          const release = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/production-draft/release.json", "utf8"));
          const expectedPrerelease = process.env.CANDIDATE_CHANNEL === "beta";
          if (
            release.tagName !== process.env.PRODUCTION_TAG
            || !release.isDraft
            || release.isPrerelease !== expectedPrerelease
          ) {
            throw new Error(`The selected Production release must still be an unpublished ${process.env.CANDIDATE_CHANNEL} Draft.`);
          }
          if (release.targetCommitish !== process.env.SOURCE_SHA) {
            throw new Error(`Production Draft target ${release.targetCommitish} does not match ${process.env.SOURCE_SHA}.`);
          }
          NODE

          gh release download "$PRODUCTION_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$RUNNER_TEMP/production-draft"
          node scripts/staging-promotion-policy.mjs validate-provenance \
            --provenance "$RUNNER_TEMP/production-draft/promotion-source.json" \
            --candidate "$RUNNER_TEMP/candidate/staging-source.json" \
            --asset-directory "$RUNNER_TEMP/production-draft" \
            --production-tag "$PRODUCTION_TAG"

          metadata_name="$([[ "$CANDIDATE_CHANNEL" == "beta" ]] && echo beta-mac.yml || echo latest-mac.yml)"
          if ! grep -Eq "^version: ['\"]?${TARGET_VERSION//./\\.}['\"]?$" "$RUNNER_TEMP/production-draft/$metadata_name"; then
            echo "::error::Draft $metadata_name does not describe Production $TARGET_VERSION."
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$PRODUCTION_TAG" >/dev/null 2>&1; then
            git fetch origin "refs/tags/$PRODUCTION_TAG:refs/tags/$PRODUCTION_TAG" --force
            tag_commit="$(git rev-list -n 1 "$PRODUCTION_TAG")"
            if [[ "$tag_commit" != "$SOURCE_SHA" ]]; then
              echo "::error::Draft tag $PRODUCTION_TAG points to $tag_commit instead of $SOURCE_SHA."
              exit 1
            fi
          fi

          draft_url="$(node -e '
            const fs = require("fs");
            process.stdout.write(JSON.parse(fs.readFileSync(process.argv[1], "utf8")).url);
          ' "$RUNNER_TEMP/production-draft/release.json")"
          echo "draft_url=$draft_url" >> "$GITHUB_OUTPUT"
          {
            echo "## Final Production Publish Approval"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Production release | [\`$TARGET_VERSION\`]($draft_url) |"
            echo "| Channel | \`$CANDIDATE_CHANNEL\` |"
            echo "| Verified candidate | [\`$CANDIDATE_VERSION\`](https://github.com/$STAGING_REPOSITORY/releases/tag/$CANDIDATE_TAG) |"
            echo "| Source commit | \`$SOURCE_SHA\` |"
            echo "| Asset integrity | SHA-256 verified |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout the exact approved source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.source_commit }}
          fetch-depth: 0
          fetch-tags: true

      - name: Setup macOS signing identity for final verification
        id: macos_signing
        uses: ./.github/actions/setup-macos-signing
        with:
          p12-base64: ${{ secrets.MACOS_SIGNING_P12_BASE64 }}
          p12-password: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
          identity: BDIH Launcher Update Signing

      - name: Verify the signed app from the Draft ZIP
        env:
          MACOS_SIGNING_IDENTITY: BDIH Launcher Update Signing
        run: |
          set -euo pipefail
          shopt -s nullglob

          zips=("$RUNNER_TEMP"/production-draft/*.zip)
          if (( ${#zips[@]} != 1 )); then
            echo "::error::Expected exactly one Production ZIP, found ${#zips[@]}."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/verified-app"
          ditto -x -k "${zips[0]}" "$RUNNER_TEMP/verified-app"
          app_path="$(find "$RUNNER_TEMP/verified-app" -maxdepth 2 -type d -name 'BDIH Launcher.app' -print -quit)"
          if [[ -z "$app_path" ]]; then
            echo "::error::Production ZIP does not contain BDIH Launcher.app."
            exit 1
          fi

          codesign --verify --deep --strict --verbose=2 "$app_path"
          signature="$(codesign -dv --verbose=4 "$app_path" 2>&1)"
          if [[ "$signature" != *"Authority=$MACOS_SIGNING_IDENTITY"* ]]; then
            echo "::error::Draft ZIP is not signed by $MACOS_SIGNING_IDENTITY."
            printf '%s\n' "$signature"
            exit 1
          fi
          codesign -dr - "$app_path"
          bash scripts/verifyMacosSigningBridge.sh "$app_path"

      - name: Publish the verified Production Draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRODUCTION_TAG: ${{ needs.create_production_draft.outputs.production_tag }}
          TARGET_VERSION: ${{ github.event.client_payload.target_version }}
          CANDIDATE_VERSION: ${{ github.event.client_payload.candidate_version }}
          CANDIDATE_CHANNEL: ${{ github.event.client_payload.channel }}
          SOURCE_SHA: ${{ github.event.client_payload.source_commit }}
        run: |
          set -euo pipefail

          publish_args=(--draft=false)
          if [[ "$CANDIDATE_CHANNEL" == "stable" ]]; then
            publish_args+=(--latest)
          else
            publish_args+=(--latest=false)
          fi
          gh release edit "$PRODUCTION_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            "${publish_args[@]}"

          release_state="$(gh release view "$PRODUCTION_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease --jq '[.isDraft, .isPrerelease] | @tsv')"
          expected_state="$([[ "$CANDIDATE_CHANNEL" == "beta" ]] && printf 'false\ttrue' || printf 'false\tfalse')"
          if [[ "$release_state" != "$expected_state" ]]; then
            echo "::error::Production release did not publish as $CANDIDATE_CHANNEL: $release_state"
            exit 1
          fi

          git fetch origin "refs/tags/$PRODUCTION_TAG:refs/tags/$PRODUCTION_TAG" --force
          tag_commit="$(git rev-list -n 1 "$PRODUCTION_TAG")"
          if [[ "$tag_commit" != "$SOURCE_SHA" ]]; then
            echo "::error::Published tag $PRODUCTION_TAG points to $tag_commit instead of $SOURCE_SHA."
            exit 1
          fi

          release_url="$(gh release view "$PRODUCTION_TAG" --repo "$GITHUB_REPOSITORY" --json url --jq '.url')"
          {
            echo ""
            echo "### Production published"
            echo ""
            echo "[$TARGET_VERSION]($release_url) was promoted from \`$CANDIDATE_VERSION\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup macOS signing identity
        if: ${{ always() && steps.macos_signing.outcome == 'success' }}
        env:
          CERTIFICATE_SHA1: ${{ steps.macos_signing.outputs.certificate-sha1 }}
          KEYCHAIN_PATH: ${{ steps.macos_signing.outputs.keychain-path }}
          SIGNING_TEMP_DIR: ${{ steps.macos_signing.outputs.temp-dir }}
        run: |
          set +e
          sudo -n security delete-certificate \
            -Z "$CERTIFICATE_SHA1" \
            /Library/Keychains/System.keychain >/dev/null 2>&1
          security delete-keychain "$KEYCHAIN_PATH" >/dev/null 2>&1
          find "$SIGNING_TEMP_DIR" -type f -delete >/dev/null 2>&1
          rmdir "$SIGNING_TEMP_DIR" >/dev/null 2>&1
