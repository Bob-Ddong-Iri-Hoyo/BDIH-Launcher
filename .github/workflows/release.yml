name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish, e.g. v1.2.3 or v1.2.3-beta.1"
        required: true
        type: string

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  SOURCE_BRANCH: main

jobs:
  release:
    name: Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          fetch-depth: 0
          fetch-tags: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release tag and resolve channel
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          TAG="${RELEASE_TAG}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must look like v1.2.3 or v1.2.3-beta.1. Got: $TAG" >&2
            exit 1
          fi

          VERSION="${TAG#v}"

          git fetch origin "refs/heads/${SOURCE_BRANCH}:refs/remotes/origin/${SOURCE_BRANCH}" --tags --force
          TAG_COMMIT="$(git rev-list -n 1 "$TAG")"

          if ! git merge-base --is-ancestor "$TAG_COMMIT" "origin/${SOURCE_BRANCH}"; then
            echo "Release tag $TAG must point to a commit reachable from origin/${SOURCE_BRANCH}." >&2
            exit 1
          fi

          if [[ "$PACKAGE_VERSION" != "$VERSION" ]]; then
            echo "Tag version ($VERSION) must match package.json version ($PACKAGE_VERSION)." >&2
            exit 1
          fi

          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"

          if [[ "$VERSION" == *"-"* ]]; then
            PRERELEASE_PART="${VERSION#*-}"
            UPDATE_CHANNEL="${PRERELEASE_PART%%.*}"
            echo "UPDATE_CHANNEL=$UPDATE_CHANNEL" >> "$GITHUB_ENV"
            echo "RELEASE_TYPE=prerelease" >> "$GITHUB_ENV"
          else
            echo "UPDATE_CHANNEL=latest" >> "$GITHUB_ENV"
            echo "RELEASE_TYPE=release" >> "$GITHUB_ENV"
          fi

      - name: Setup macOS signing identity
        id: macos_signing
        uses: ./.github/actions/setup-macos-signing
        with:
          p12-base64: ${{ secrets.MACOS_SIGNING_P12_BASE64 }}
          p12-password: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
          identity: BDIH Launcher Update Signing

      - name: Build and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BDIH_DISCORD_CLIENT_ID: ${{ vars.BDIH_DISCORD_CLIENT_ID || secrets.BDIH_DISCORD_CLIENT_ID }}
          BDIH_DISCORD_SHOW_IDLE: ${{ vars.BDIH_DISCORD_SHOW_IDLE || 'true' }}
          BDIH_DISCORD_LARGE_IMAGE_KEY: ${{ vars.BDIH_DISCORD_LARGE_IMAGE_KEY || 'bdih_logo' }}
        run: |
          set -euo pipefail
          if [[ -z "${BDIH_DISCORD_CLIENT_ID:-}" ]]; then
            echo "::warning::BDIH_DISCORD_CLIENT_ID is not set; Discord Rich Presence will be disabled in this build."
          fi
          pnpm build
          pnpm exec electron-builder --mac --publish always --config electron-builder.config.cjs

      - name: Verify published app signature
        env:
          MACOS_SIGNING_IDENTITY: BDIH Launcher Update Signing
        run: |
          set -euo pipefail

          app_path="$(find release -mindepth 2 -maxdepth 2 -type d -name '*.app' -print -quit)"
          if [[ -z "$app_path" ]]; then
            echo "::error::No packaged macOS application was found."
            exit 1
          fi

          codesign --verify --deep --strict --verbose=2 "$app_path"
          signature="$(codesign -dv --verbose=4 "$app_path" 2>&1)"
          if [[ "$signature" != *"Authority=$MACOS_SIGNING_IDENTITY"* ]]; then
            echo "::error::The packaged app was not signed by $MACOS_SIGNING_IDENTITY."
            printf '%s\n' "$signature"
            exit 1
          fi

          codesign -dr - "$app_path"
          bash scripts/verifyMacosSigningBridge.sh "$app_path"

      - name: Cleanup macOS signing identity
        if: ${{ always() && steps.macos_signing.outcome == 'success' }}
        env:
          CERTIFICATE_SHA1: ${{ steps.macos_signing.outputs.certificate-sha1 }}
          KEYCHAIN_PATH: ${{ steps.macos_signing.outputs.keychain-path }}
          SIGNING_TEMP_DIR: ${{ steps.macos_signing.outputs.temp-dir }}
        run: |
          set +e
          sudo -n security delete-certificate \
            -Z "$CERTIFICATE_SHA1" \
            /Library/Keychains/System.keychain >/dev/null 2>&1
          security delete-keychain "$KEYCHAIN_PATH" >/dev/null 2>&1
          find "$SIGNING_TEMP_DIR" -type f -delete >/dev/null 2>&1
          rmdir "$SIGNING_TEMP_DIR" >/dev/null 2>&1
